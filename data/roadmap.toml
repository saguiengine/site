# The roadmap as the devlog shows it, stage by stage. `state` is done, now
# or next; "{linguagem}" becomes the script language's name (identity.toml).
# A stage that is done links to its milestone post (`post`, its folder in
# content/devlog). Update `state` and `post` when a stage ends, in the same
# PR as its milestone post.
#
# The stage in progress lists its deliveries (`delivery`): what each line
# says, how many deliveries of the spec it covers (`count`, so "1 to 4"
# counts 4), `state` done or next, and the post that tells it. Each
# delivery's post updates this list in the same PR (D401).

[[stage]]
pt = "Etapa 0: provas"
en = "Stage 0: proofs"
state = "done"
post = "etapa-0"

[[stage]]
pt = "Etapa 1: base"
en = "Stage 1: foundation"
state = "done"
post = "etapa-1"

