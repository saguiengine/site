# Checks every push to main and every pull request: the brand only in
# identity.toml (E9.2), the address and noindex of each kind of deploy
# (E9.4, D383), images, numbers, the 404 pages, touch targets on a phone and
# a build with every internal link checked.
# GitHub-hosted runners only: this public repository never runs on a
# self-hosted runner. Actions pinned by SHA (updated by Dependabot).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The same version as ZOLA_VERSION in Cloudflare Pages (D380).
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zola
        run: |
          curl -fsSL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf zola.tar.gz -C "$HOME/.local/bin" zola
          rm zola.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zola --version
      - name: Unit tests of build.py
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: The brand only in identity.toml, and E9.2
        run: python3 scripts/check_brand.py
      - name: Address, E9.4, images, numbers and 404
        run: python3 scripts/check_site.py
      - name: Touch targets on a phone (Chrome of the runner image)
        run: python3 scripts/check_touch.py
      - name: Internal links
        run: zola check --skip-external-links
      - name: Build
        run: python3 build.py
