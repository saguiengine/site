# The site's configuration. No brand here: names and the address come from
# identity.toml, a copy of the engine's (D276, D379), read by the templates
# and by build.py, which passes the address to `zola build --base-url`.
base_url = "http://127.0.0.1:1111"

default_language = "pt"
compile_sass = false
minify_html = false
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
generate_robots_txt = true
build_search_index = false

[markdown]
smart_punctuation = false
external_links_no_referrer = true

[markdown.highlighting]
error_on_missing_language = false
theme = "github-dark"

[link_checker]
internal_level = "error"
external_level = "warn"

